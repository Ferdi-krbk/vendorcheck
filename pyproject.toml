[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "vendorcheck"
dynamic = ["version"]
description = "Check whether embedded/vendored Python packages are identical to the official PyPI release."
readme = "README.md"
license = { text = "MIT" }
requires-python = ">=3.9"
keywords = ["supply-chain", "security", "vendoring", "pypi", "audit"]
classifiers = [
  "License :: OSI Approved :: MIT License",
  "Programming Language :: Python :: 3",
  "Topic :: Security",
]

[project.scripts]
vendorcheck = "vendorcheck:main"

[project.urls]
Homepage = "https://github.com/Ferdi-krbk/vendorcheck"

[tool.setuptools]
py-modules = ["vendorcheck"]

[tool.setuptools.dynamic]
version = { attr = "vendorcheck.__version__" }
