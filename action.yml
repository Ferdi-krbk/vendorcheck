name: vendorcheck
description: Fail CI if embedded (vendored/bundled) Python packages differ from the official PyPI release.
author: Ferdi-krbk
branding:
  icon: shield
  color: green
inputs:
  path:
    description: Directory or archive (.zip/.xpi/.vsix/.fda/...) to audit.
    required: true
  only:
    description: Space-separated package names to check (default - all detected).
    required: false
    default: ""
  allow-empty:
    description: Do not fail when no embedded packages are found.
    required: false
    default: "false"
  strict:
    description: Fail (exit code 2) if unrecognized package directories (without detectable version) are found.
    required: false
    default: "false"
  ignore:
    description: Newline-separated globs to ignore (intentional local patches).
    required: false
    default: ""
runs:
  using: composite
  steps:
    - uses: actions/setup-python@v5
      with:
        python-version: "3.x"
    - shell: bash
      env:
        VC_PATH: ${{ inputs.path }}
        VC_ONLY: ${{ inputs.only }}
        VC_EMPTY: ${{ inputs.allow-empty }}
        VC_STRICT: ${{ inputs.strict }}
        VC_IGNORE: ${{ inputs.ignore }}
      run: |
        args=("$VC_PATH" -v)
        if [ "$VC_EMPTY" = "true" ]; then args+=(--allow-empty); fi
        if [ "$VC_STRICT" = "true" ]; then args+=(--strict); fi
        if [ -n "$VC_ONLY" ]; then args+=(--only $VC_ONLY); fi
        while IFS= read -r g; do
          if [ -n "$g" ]; then args+=(--ignore "$g"); fi
        done <<< "$VC_IGNORE"
        python "${{ github.action_path }}/vendorcheck.py" "${args[@]}"
